# Tag it and it goes live. Nothing else deploys — a merge to main is only code
# that is ready, a tag is code you have decided to put on the roof.
#
# Both shapes of tag fire it, so v1.2.0 and 1.2.0 behave the same.
name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

# One at a time. Two rsyncs into the same folder would interleave.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test test/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Take the deploy key
        run: |
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::error::SSH_KEY is not set. Add the deploy key's *private* half as a repository secret."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy it up
        run: |
          rsync -rtz \
            --exclude '.git' --exclude '.github' --exclude '.gitignore' \
            --exclude '.DS_Store' --exclude '.playwright-mcp' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}"

      - name: Check it answers
        run: |
          for path in / /style.css /src/main.js /data/cuts.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "${{ vars.SITE_URL || 'http://gginternational.net/roof' }}$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Note the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag || echo "release already exists, leaving it alone"
